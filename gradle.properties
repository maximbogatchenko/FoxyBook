org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Enable Gradle build cache so agent builds get cache hits on unchanged template
# files. Cache is keyed by content hash (not path), so copies of this workspace
# reuse entries compiled into the worker Docker image via assembleDebug --build-cache.
org.gradle.caching=true
org.gradle.parallel=true
# JDK 17 required. Путь к JDK намеренно не задан: org.gradle.java.home с
# абсолютным путом ломает сборку на любой машине, где JDK установлен иначе.
# Задать локально при необходимости в ~/.gradle/gradle.properties.
